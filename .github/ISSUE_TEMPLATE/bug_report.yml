name: Bug report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: App version (e.g. from About or release tag)
      placeholder: "0.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Other
    validations:
      required: true

  - type: dropdown
    id: install-type
    attributes:
      label: Install type
      description: Portable build or installed application
      options:
        - Portable
        - Installed
        - Not sure
    validations:
      required: true

  - type: input
    id: s3-provider
    attributes:
      label: S3 provider
      description: e.g. AWS, MinIO, Cloudflare R2, Backblaze B2
      placeholder: AWS S3
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps to trigger the bug
      placeholder: |
        1. Open the app
        2. Connect to bucket X
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant logs or stack traces. Do not paste secrets, access keys, or session tokens.
      render: shell
    validations:
      required: false
