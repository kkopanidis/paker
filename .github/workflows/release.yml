name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to rebuild (e.g. v0.6.0)
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
          cache-all-crates: true

      - run: npm run test:all

  release:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
          - platform: windows-latest
            args: ""
            rust_target: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set version from git tag
        shell: bash
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Release tag must be vX.Y.Z, got ${RELEASE_TAG}"
            exit 1
          fi
          if [[ ! -f scripts/set-version-from-tag.mjs ]]; then
            git fetch origin main --depth=1
            git checkout origin/main -- scripts/set-version-from-tag.mjs
          fi
          node scripts/set-version-from-tag.mjs "${RELEASE_TAG}"
          npm run version:sync -- --check

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust cross-compilation target
        if: matrix.rust_target != ''
        run: rustup target add ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Paker ${{ env.RELEASE_TAG }}
          releaseBody: See CHANGELOG.md
          releaseDraft: true
          args: ${{ matrix.args }}

      - name: Package Windows portable zip
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $exe = "src-tauri/target/release/paker.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected binary not found: $exe"
          }
          $staging = "dist/portable-windows"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item $exe "$staging/paker.exe"
          New-Item -ItemType File -Force -Path "$staging/portable.txt" | Out-Null
          $zip = "dist/Paker-$version-windows-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$staging/paker.exe", "$staging/portable.txt" -DestinationPath $zip

      - name: Upload Windows portable asset
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")"
          gh release upload "${RELEASE_TAG}" "dist/Paker-${VERSION}-windows-portable.zip" --clobber

  publish:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}

      - run: gh release edit "${RELEASE_TAG}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
