[package]
name = "paker"
version = "0.8.2"
description = "Paker S3 desktop browser"
authors = ["Konstantinos Kopanidis"]
edition = "2021"

[lib]
name = "paker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
integration-tests = []

[[test]]
name = "s3_integration"
path = "tests/s3_integration.rs"
required-features = ["integration-tests"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
aws-smithy-http-client = { version = "1", features = ["hyper-014", "legacy-rustls-ring"] }
aws-smithy-runtime-api = "1"
hyper-rustls = { version = "0.24", default-features = false, features = ["http1", "tls12", "native-tokio"] }
rustls = { version = "0.21", features = ["dangerous_configuration"] }
tokio = { version = "1", features = ["full"] }
keyring = "4"
keyring-core = "1"
uuid = { version = "1", features = ["v4"] }
aes-gcm = "0.11"
argon2 = "0.5"
rand = "0.9"
base64 = "0.22"
anyhow = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
lru = "0.18"
rfd = "0.17"
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }
parking_lot = "0.12"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = { version = "0.3", features = ["block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Security_Credentials_UI",
    "Foundation",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
aws-sdk-s3 = "1"
aws-config = "1"
aws-credential-types = "1"
