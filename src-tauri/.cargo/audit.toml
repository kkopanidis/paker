# rustls-webpki 0.101.7 is pulled transitively by aws-smithy-http-client (rustls 0.21).
# Direct TLS (reqwest) uses rustls 0.23 + webpki 0.103.13 (patched).
# h2 0.3 has no patched release for RUSTSEC-2026-0258; it comes from hyper 0.14
# via aws-smithy-http-client's hyper-014 TLS client. h2 0.4 is patched (>=0.4.16).
# Remove these ignores when aws-sdk drops the rustls 0.21 / hyper 0.14 stack.
[advisories]
ignore = [
    "RUSTSEC-2026-0099",
    "RUSTSEC-2026-0098",
    "RUSTSEC-2026-0104",
    "RUSTSEC-2026-0258",
]
